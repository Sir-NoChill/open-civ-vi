[package]
name = "open4x-accounts"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "open4x-accounts"
path = "src/bin/cli.rs"
required-features = ["persistence"]

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
ulid       = { workspace = true }
clap       = { workspace = true, optional = true }

# Persistence (sqlite by default, postgres optional). Gated behind
# `persistence` so the type-only consumers (open4x-lobby's csr build,
# tests) don't have to drag the sqlx graph in.
sqlx       = { version = "0.8", optional = true, features = [
    "runtime-tokio", "tls-rustls", "macros", "sqlite", "chrono",
    "migrate",
] }
tokio      = { workspace = true, optional = true }
chrono     = { version = "0.4", default-features = false, features = ["clock", "serde"], optional = true }
thiserror  = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }

# Magic-link minting (HMAC-SHA256 + base64url envelope + constant-time
# compare). Pulled in alongside persistence because the nonce table is
# part of the schema.
hmac       = { version = "0.12", optional = true }
sha2       = { version = "0.10", optional = true }
subtle     = { version = "2", optional = true }
base64     = { version = "0.22", optional = true }
rand       = { workspace = true, optional = true }

# SMTP transport — gated behind `mailer-smtp`. Default-features off
# keeps the dependency graph lean (no native-tls).
lettre     = { version = "0.11", default-features = false, optional = true, features = [
    "smtp-transport", "tokio1", "tokio1-rustls-tls", "builder",
] }

[features]
default     = []
persistence = [
    "dep:sqlx", "dep:tokio", "dep:chrono", "dep:thiserror", "dep:async-trait",
    "dep:hmac", "dep:sha2", "dep:subtle", "dep:base64", "dep:rand",
    "dep:clap",
]
postgres    = ["persistence", "sqlx/postgres"]
# SMTP transport for the magic-link Mailer. Pulls in `lettre` for
# AsyncSmtpTransport (rustls + tokio).
mailer-smtp = ["persistence", "dep:lettre"]
