[package]
name = "open4x-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "open4x"
path = "src/main.rs"

[dependencies]
libciv = { path = "../libciv", features = ["serde"] }
libhexgrid = { path = "../libhexgrid" }
clap = { workspace = true, features = ["env"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
rustyline = { workspace = true }
# Remote (`--server`) mode goes through the typed SDK. `native-blocking`
# keeps the CLI's existing synchronous call-site shape: no tokio runtime,
# no .await sprinkled through handler code.
open4x-sdk = { path = "../open4x-sdk", default-features = false, features = ["native-blocking"] }
# Tiny no-op-style executor used by `remote::client` to drain the SDK's
# immediately-ready Transport future from sync code.
pollster = "0.3"

# `reqwest` is no longer a runtime dep — the SDK owns the HTTP client.
# The `remote_parity` integration test still pokes `/health` directly
# while waiting for the spawned server to come up; keep reqwest available
# under dev-deps for that probe.
[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
