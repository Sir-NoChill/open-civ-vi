[package]
name = "open4x-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "open4x"
path = "src/main.rs"

[dependencies]
libciv = { path = "../libciv", features = ["serde"] }
libhexgrid = { path = "../libhexgrid" }
clap = { workspace = true, features = ["env"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
rustyline = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
