<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Open4X-VI · hi-fi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hifi/styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="hifi/popup.jsx"></script>
<script type="text/babel" src="hifi/components.jsx"></script>
<script type="text/babel" src="hifi/landing.jsx"></script>
<script type="text/babel" src="hifi/login.jsx"></script>
<script type="text/babel" src="hifi/menu.jsx"></script>
<script type="text/babel" src="hifi/newgame.jsx"></script>

<script type="text/babel">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "density": "comfortable"
}/*EDITMODE-END*/;

const SCREENS = [
  { id: "landing", label: "01 Landing" },
  { id: "login",   label: "02 Login" },
  { id: "menu",    label: "03 Menu" },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAKS);
  const [screen, setScreen] = React.useState("landing");
  const [menuTab, setMenuTab] = React.useState("ongoing");

  let menuContent = null;
  if (menuTab === "ongoing") menuContent = <window.OngoingGames onNew={() => setMenuTab("newgame")} />;
  else if (menuTab === "newgame") menuContent = <window.NewGame />;
  else if (menuTab === "profile") menuContent = <window.Profile />;
  else menuContent = <div className="content-header"><div className="title">{menuTab}</div><span className="crumbs">// out of scope</span></div>;

  const screenLabel =
    screen === "landing" ? "01 Landing"
    : screen === "login" ? "02 Login"
    : `03 Menu · ${menuTab}`;

  return (
    <PopupProvider>
      <div className="app" data-density={t.density}>
        <header className="app-bar">
          <div className="brand"><span className="glyph">⌬</span> OPEN4X·VI</div>
          <span className="pill">HI-FI</span>
          <nav>
            {SCREENS.map(s => (
              <button key={s.id} aria-current={screen === s.id} onClick={() => setScreen(s.id)}>{s.label}</button>
            ))}
          </nav>
          <div className="right">
            <span><span className="dot"></span> open4x.dev</span>
            <span className="kbd">?</span>
          </div>
        </header>

        <div className="screen" data-screen-label={screenLabel}>
          {screen === "landing" && <window.Landing />}
          {screen === "login" && <window.Login onBack={() => setScreen("landing")} />}
          {screen === "menu" && (
            <window.Shell tab={menuTab} setTab={setMenuTab}>
              {menuContent}
            </window.Shell>
          )}
        </div>

        <TweaksPanel title="Tweaks">
          <TweakSection title="Density">
            <TweakRadio tweakKey="density" value={t.density} onChange={setTweak}
              options={[
                { value: "compact", label: "compact" },
                { value: "comfortable", label: "comfy" },
                { value: "spacious", label: "spacious" },
              ]} />
          </TweakSection>
          <TweakSection title="Jump to">
            <div style={{display:"flex", flexDirection:"column", gap:4}}>
              <button className="btn sm" onClick={() => setScreen("landing")}>→ landing</button>
              <button className="btn sm" onClick={() => setScreen("login")}>→ login</button>
              <button className="btn sm" onClick={() => { setScreen("menu"); setMenuTab("ongoing"); }}>→ ongoing games</button>
              <button className="btn sm" onClick={() => { setScreen("menu"); setMenuTab("newgame"); }}>→ new game</button>
              <button className="btn sm" onClick={() => { setScreen("menu"); setMenuTab("profile"); }}>→ profile</button>
            </div>
          </TweakSection>
          <TweakSection title="Hint">
            <p className="muted xsmall" style={{ margin: 0 }}>
              Hover any underlined word, ··· button, or dim "manage / how it works" link to see a Gwern-style popup. Click to pin · Esc to close.
            </p>
          </TweakSection>
        </TweaksPanel>
      </div>
    </PopupProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
